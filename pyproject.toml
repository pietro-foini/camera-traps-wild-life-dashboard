[tool.poetry]
name = "camera-traps-wild-life-dashboard"
version = "0.0.1"
description = "Machine Learning-powered camera trap wildlife dashboard"
authors = ["PFoini <pietro.foini1@gmail.com>"]
readme = "README.md"
packages = [{ include = "camera_traps" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
Flask = "3.1.3"
Authlib = "1.9.1"
gunicorn = "26.0.0"
pydantic = "2.13.5"
pydantic-settings = "2.8.1"
dash = "4.4.1"
dash-mantine-components = "2.8.0"
dash-ag-grid = "32.3.4"
dash-iconify = "0.1.2"
plotly = "6.7.0"
pandas = "3.1.0"
SQLAlchemy = "2.0.52"
psycopg2-binary = "2.9.13"

[tool.poetry.group.dev.dependencies]
isort = "^5.12"
black = "^22"
mypy = "^1.3"
pre-commit = "^4.3.0"
pydocstyle = "^6.3"
notebook = "7.6.2"
traitlets = "5.16.1"
ipywidgets = "8.1.9"
setuptools = "81.0.0"

[tool.poetry.group.test.dependencies]
pytest-mock = "^3.7.0"
mock = "^4.0.3"
pytest = "7.1.2"
httpx2 = "2.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
exclude = '''
/(\n  \\.git\n  | \\.hg\n  | \\.mypy_cache\n  | \\.tox\n  | \\.venv\n  | _build\n  | buck-out\n  | build\n  | dist\n  | dockerfile\n  | \.md\n  | \.txt\n  | \.gitignore\n  | \.lock\n)/\n
'''

[tool.isort]
skip_glob = ["tests/*"]
profile = "black"
line_length = 120
